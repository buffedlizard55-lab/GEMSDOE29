name: CI

on:
  push:
    branches: [main, "arena/01a10075-gemsdoe29", "arena/01a10240-gemsdoe29", "arena/01a10342-gemsdoe29"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Lint
        run: ruff check src scripts tests
      - name: Validate generated Pages HTML
        run: python scripts/build_site.py --check
      - name: Validate checked-in JSON registers
        run: python -c 'import json, pathlib; files=list(pathlib.Path("registry").glob("*.json")); [json.loads(p.read_text()) for p in files]; print(f"validated {len(files)} JSON registers")'
